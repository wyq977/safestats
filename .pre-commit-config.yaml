repos:
-   repo: https://github.com/lorenzwalthert/precommit
    rev: v0.4.3.9003
    hooks: 
    #### WILL MODIFY FILES ####
    - id: use-tidy-description
    - id: roxygenize
    - id: style-files
      args:
        ['--ignore-start="^# styler: off$"', '--ignore-stop="^# styler: on$"']
      exclude: >
        (?x)^(
        tests/testthat/.*/.*\.R(md|nw)?|
        vignettes/customizing_styler\.Rmd|
        tests/testthat/public-api/xyzfile-rnw/random4\.Rnw|
        vignettes/detect-alignment\.Rmd|
        tests/testmanual/addins/.*invalid.*|
        tests/testmanual/addins/r-valid\.R|
        )$
    #### DO NOT MODIFY FILES ####
    # Checks if your .R and .Rmd files are “valid” R code
    - id: parsable-R
    # No browser() statement in it.
    - id: no-browser-statement
    # No print() statement in it.
    - id: no-print-statement
    # No debug() or debugonce().
    - id: no-debug-statement
    # Checks if packages used are listed in your DESCRIPTION file.
    - id: deps-in-desc
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks: 
    - id: check-added-large-files
    - id: end-of-file-fixer
      exclude: '\.Rd' # sometimes roxygen fails to generate EOF blank line.
    - id: file-contents-sorter
      files: '^\.Rbuildignore$'
